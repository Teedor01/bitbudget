[package]
name = "bitbudget-anchor"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"      # = near-sdk 5.30.0's declared rust-version (the highest MSRV in its dependency tree)
publish = false

[lib]
crate-type = ["cdylib"]    # no rlib: NEAR guidance for deployable size; unit tests still run

[dependencies]
near-sdk = "=5.30.0"       # exact pin; Cargo.lock is committed and CI uses --locked

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"

# The vmtest crate is a separate package (its own lockfile and target) so it can never affect the contract build.
[workspace]
exclude = ["vmtest"]
